name: Translation fix
description: Report a string that reads wrong in your language and suggest a better one.
title: "[<lang>] <short description>"
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping VHT.ai read naturally in your language. One string per issue is ideal; a short list of related strings is fine too.
        This is a public repository: describe the screen in words, never paste personal or health information.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - fr (French)
        - ja (Japanese)
        - zh-CN (Simplified Chinese)
        - es (Spanish)
        - de (German)
        - pt (Brazilian Portuguese)
        - en (English source text)
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key or screen
      description: The JSON key (for example `nav.pricing` in `public.json`, or the English string in `member-settings.json`) or, if you do not know it, the screen where you saw the text.
      placeholder: pages.contact.title  /  "Settings > Notifications" screen
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text exactly as it appears now.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: Your proposed wording. Keep placeholders such as `{0}` and brand names unchanged. Add a line on why, if it is not obvious.
    validations:
      required: true
  - type: checkboxes
    id: phi
    attributes:
      label: Privacy
      options:
        - label: This contains no personal health information.
          required: true
